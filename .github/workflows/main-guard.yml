name: main-guard

# Detection control, not prevention: branch protection is the barrier (public
# repo or Pro). This workflow flags a push to main that is not a verified
# pull-request merge. It only runs when the repository uses PR mode
# (REQUIRE_PR=true); a local-mode project would otherwise flag its own
# chore(merge) commits. The logic lives in scripts/devloop/main-guard.sh so the
# failure paths are testable.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Is this repository in PR mode?
        id: mode
        run: |
          if grep -qE "^REQUIRE_PR=(\"true\"|'true'|true)[[:space:]]*$" .devloop.conf 2>/dev/null; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo enabled=false >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the push is a merged pull request
        if: steps.mode.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.after }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/devloop/main-guard.sh
